<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Painel Médico - NOVAMED</title>

  <!-- CSS externo -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================================
       PAINEL PRINCIPAL
  ========================================== -->

  <div class="container">

    <!-- Cabeçalho -->
    <div class="painel-header">

      <h2>🩺 Painel Médico</h2>

      <button
        class="btn-abrir-tv"
        onclick="window.open('tv.html', '_blank')">

        📺 Abrir Tela da TV

      </button>

    </div>


    <!-- =========================================
         CONSULTÓRIO
    ========================================== -->

    <div class="consultorio-input">

      <label for="consultorio-num">
        Meu Consultório:
      </label>

      <input
        type="text"
        id="consultorio-num"
        value="01"
        maxlength="3">

      <span>
        Este número será exibido na TV ao chamar o paciente.
      </span>

    </div>


    <hr>


    <!-- =========================================
         FORMULÁRIO DA CONSULTA
    ========================================== -->

    <div class="form-consulta">

      <h3>Consulta</h3>


      <!-- Paciente selecionado -->
      <input
        id="paciente"
        placeholder="Paciente"
        readonly>


      <!-- Diagnóstico -->
      <input
        id="diagnostico"
        placeholder="Diagnóstico">


      <!-- Medicação -->
      <select id="medicacao">

        <option value="">
          Selecione a medicação
        </option>

      </select>


      <!-- Observações -->
      <textarea
        id="obs"
        placeholder="Observações"></textarea>


      <!-- Salvar -->
      <button
        class="btn-salvar"
        onclick="salvar()">

        💾 Salvar Consulta

      </button>

    </div>

  </div>


  <!-- =========================================
       INFORMAÇÕES DO SISTEMA
  ========================================== -->

  <div class="container">

    <header>

      <h1>Painel do Médico</h1>

      <p>
        Demonstração de CRUD frontend/backend (Node.js)
      </p>

      <button
        class="btn-pdf"
        onclick="window.print()">

        📄 Baixar PDF

      </button>

    </header>

  </div>


  <!-- =========================================
       LISTA DE TRIAGENS
  ========================================== -->

  <div id="triagens"></div>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>

    /* =========================================
       VARIÁVEL GLOBAL
    ========================================== */

    let triagensCarregadas = [];


    /* =========================================
       CARREGAR TRIAGENS
    ========================================== */

    function carregar() {

      fetch("/triagens")

        .then(r => r.json())

        .then(data => {

          triagensCarregadas = data;

          const div =
            document.getElementById("triagens");

          div.innerHTML = "";


          /* Nenhum paciente */

          if (data.length === 0) {

            div.innerHTML = `
              <div class="fila-vazia">

                🏥

                <br><br>

                Nenhum paciente na fila.

              </div>
            `;

            return;
          }


          /* =========================================
             CRIAR CARDS DOS PACIENTES
          ========================================== */

          data.forEach((t, index) => {

            div.innerHTML += `

              <div class="card">

                <h3>
                  👤 ${t.nome}
                </h3>


                <p>

                  <b>Sintoma:</b>

                  ${t.sintoma || "Não informado"}

                </p>


                <p>

                  <b>Temperatura:</b>

                  ${t.temperatura || "Não informada"}°C

                </p>


                <p>

                  <b>Classificação:</b>

                  <span class="${t.risco}">

                    ${t.risco}

                  </span>

                </p>


                <p>

                  <b>Alergia:</b>

                  ${t.alergia || "Nenhuma"}

                </p>


                <p>

                  <b>Observação:</b>

                  ${t.observacao || "Nenhuma"}

                </p>


                <!-- =================================
                     BOTÕES
                ================================== -->

                <div class="card-acoes">


                  <!-- Atender -->

                  <button
                    onclick="selecionar(${index})">

                    🩺 Atender

                  </button>


                  <!-- Chamar na TV -->

                  <button
                    class="btn-tv"
                    onclick="chamarNaTV('${t.nome}')">

                    📺 Chamar na TV

                  </button>


                  <!-- Dar Alta -->

                  <button
                    class="btn-alta"
                    onclick="window.location.href='alta.html'">

                    🏠 Dar Alta

                  </button>


                </div>

              </div>

            `;

          });

        })

        .catch(error => {

          console.error(
            "Erro ao carregar triagens:",
            error
          );

        });

    }


    /* =========================================
       CHAMAR PACIENTE NA TV
    ========================================== */

    function chamarNaTV(nome) {

      const consultorio =
        document.getElementById(
          "consultorio-num"
        ).value || "01";


      fetch("/tv/chamar", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          localTipo: "CONSULTÓRIO",

          localNumero: consultorio,

          paciente: nome

        })

      })

      .then(r => r.json())

      .then(() => {

        alert(
          "✅ " +
          nome +
          " foi chamado na TV para o Consultório " +
          consultorio +
          "!"
        );

      })

      .catch(error => {

        console.error(
          "Erro ao chamar paciente:",
          error
        );

        alert(
          "❌ Não foi possível chamar o paciente na TV."
        );

      });

    }


    /* =========================================
       SELECIONAR PACIENTE
    ========================================== */

    function selecionar(index) {

      const t =
        triagensCarregadas[index];


      /* Colocar nome */

      document.getElementById(
        "paciente"
      ).value = t.nome;


      /* Colocar observação */

      document.getElementById(
        "obs"
      ).value = t.observacao || "";


      /* Verificar alergia */

      if (
        t.alergia &&
        t.alergia !== "Nenhuma"
      ) {

        alert(
          "⚠️ Paciente possui alergia: " +
          t.alergia
        );

      }


      /* Rolar até o formulário */

      document.querySelector(
        ".form-consulta"
      ).scrollIntoView({

        behavior: "smooth",

        block: "center"

      });

    }


    /* =========================================
       CARREGAR MEDICAÇÕES
    ========================================== */

    function carregarMedicacoes() {

      fetch("/lista-medicacoes")

        .then(r => r.json())

        .then(data => {

          const select =
            document.getElementById(
              "medicacao"
            );


          select.innerHTML = `

            <option value="">

              Selecione a medicação

            </option>

          `;


          data.forEach(med => {

            const option =
              document.createElement(
                "option"
              );


            option.value = med;

            option.textContent = med;


            select.appendChild(
              option
            );

          });

        })

        .catch(error => {

          console.error(
            "Erro ao carregar medicações:",
            error
          );

        });

    }


    /* =========================================
       SALVAR CONSULTA
    ========================================== */

    function salvar() {

      const paciente =
        document.getElementById(
          "paciente"
        ).value;


      const diagnostico =
        document.getElementById(
          "diagnostico"
        ).value;


      const medicacao =
        document.getElementById(
          "medicacao"
        ).value;


      const obs =
        document.getElementById(
          "obs"
        ).value;


      /* =========================================
         VALIDAR PACIENTE
      ========================================== */

      if (!paciente) {

        alert(
          "⚠️ Selecione um paciente clicando em Atender."
        );

        return;

      }


      /* =========================================
         VALIDAR MEDICAÇÃO
      ========================================== */

      if (!medicacao) {

        alert(
          "⚠️ Selecione uma medicação."
        );

        return;

      }


      /* =========================================
         ENVIAR CONSULTA
      ========================================== */

      fetch("/consulta", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          paciente,

          diagnostico,

          medicacao,

          obs

        })

      })

      .then(r => r.json())

      .then(() => {

        alert(
          "✅ Consulta salva com sucesso!"
        );


        /* Limpar formulário */

        document.getElementById(
          "diagnostico"
        ).value = "";


        document.getElementById(
          "medicacao"
        ).value = "";


        document.getElementById(
          "obs"
        ).value = "";

      })

      .catch(error => {

        console.error(
          "Erro ao salvar consulta:",
          error
        );

        alert(
          "❌ Não foi possível salvar a consulta."
        );

      });

    }


    /* =========================================
       INICIALIZAÇÃO
    ========================================== */

    carregar();

    carregarMedicacoes();


    /* =========================================
       ATUALIZAR FILA AUTOMATICAMENTE
       A CADA 10 SEGUNDOS
    ========================================== */

    setInterval(
      carregar,
      10000
    );

  </script>

</body>

</html>
